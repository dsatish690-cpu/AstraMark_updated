openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: enquiries
    description: Website sales and support enquiries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /enquiries:
    post:
      operationId: sendEnquiry
      tags: [enquiries]
      summary: Send an enquiry to the appropriate Astramark inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquirySent"
        "400":
          description: Enquiry is invalid or rejected by spam protection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many recent attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EnquiryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        companyName:
          type: string
          maxLength: 120
        mobile:
          type: string
          minLength: 10
          maxLength: 13
          pattern: '^(?:\+?91)?[6-9][0-9]{9}$'
        requestType:
          type: string
          enum:
            - Machine enquiry
            - Service or technical support
            - Configuration question
        machine:
          type: string
          maxLength: 120
        details:
          type: string
          minLength: 10
          maxLength: 3000
        website:
          type: string
          maxLength: 200
      required:
        - name
        - email
        - requestType
        - machine
        - details
        - website
    EnquirySent:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

